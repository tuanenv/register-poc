<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="เข้าสู่ระบบ Register POC">
<title>เข้าสู่ระบบ | Register POC</title>
<style>
:root{--blue:#2679bc;--blue-dark:#103b61;--blue-mid:#194f7d;--bg:#f0effd;--text:#0f172a;--muted:#718096;--border:#d4dbe6;--danger:#b42318;--danger-bg:#fef3f2;--ok:#067647;--ok-bg:#ecfdf3}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Thai",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 38%,#fff 0,#f4f3ff 42%,#ebeafd 100%);display:grid;place-items:center;padding:28px}.login-shell{width:min(980px,100%);min-height:580px;display:grid;grid-template-columns:1.08fr .98fr;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 26px 75px rgba(41,47,91,.18)}.brand-panel{position:relative;overflow:hidden;color:#fff;padding:48px 56px;background:linear-gradient(145deg,#3388c8 0%,#194f7d 42%,#103b61 100%);display:flex;flex-direction:column;justify-content:center}.brand-panel:before{content:"";position:absolute;width:320px;height:320px;border:52px solid rgba(255,255,255,.045);border-radius:50%;right:-145px;bottom:-120px}.brand-panel:after{content:"";position:absolute;width:86px;height:86px;border:1px solid rgba(255,255,255,.15);border-radius:50%;right:64px;top:58px}.spark-logo-wrap{position:relative;z-index:1;width:min(330px,90%);min-height:120px;display:flex;align-items:center;justify-content:flex-start;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 14px 35px rgba(4,32,54,.25)}.spark-logo{display:block;width:100%;height:auto;max-height:128px;object-fit:contain;object-position:left center}.overline{margin-top:25px;font-size:12px;letter-spacing:.19em;font-weight:750;opacity:.72;position:relative;z-index:1}.brand-panel h1{margin:20px 0 22px;font-size:38px;line-height:1.27;max-width:380px;position:relative;z-index:1}.brand-panel p{margin:0;max-width:390px;font-size:14px;line-height:1.65;opacity:.84;position:relative;z-index:1}.login-panel{padding:54px 56px;display:flex;flex-direction:column;justify-content:center}.welcome{display:flex;gap:14px;align-items:center;margin-bottom:30px}.shield{width:48px;height:48px;border-radius:14px;background:#e7f4fd;color:#2679bc;display:grid;place-items:center;font-size:22px}.welcome h2{margin:0 0 5px;font-size:24px}.welcome p{margin:0;color:var(--muted);font-size:12px}.field{margin-bottom:17px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.input-wrap{position:relative}.input-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#98a2b3;font-size:18px}.input-wrap input{width:100%;height:44px;padding:0 42px;border:1px solid var(--border);border-radius:10px;outline:none;transition:.15s;background:#fff}.input-wrap input:focus{border-color:#4c9bd3;box-shadow:0 0 0 3px #e4f1fb}.toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#667085;padding:5px;font-size:12px}.login-btn{width:100%;height:48px;border:0;border-radius:10px;background:linear-gradient(90deg,#3389cc,#236aad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-top:5px;box-shadow:0 9px 18px rgba(38,121,188,.25)}.login-btn:hover:not(:disabled){filter:brightness(.97);transform:translateY(-1px)}.login-btn:disabled{opacity:.55;cursor:not-allowed}.message{display:none;margin-top:15px;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.5}.message.show{display:block}.message.bad{background:var(--danger-bg);color:var(--danger)}.message.good{background:var(--ok-bg);color:var(--ok)}.footer{text-align:center;color:#98a2b3;font-size:11px;margin-top:34px}.config-error{background:var(--danger-bg);color:var(--danger);padding:11px;border-radius:9px;font-size:12px;margin-bottom:14px}.hidden{display:none!important}@media(max-width:800px){body{padding:16px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:21px}.brand-panel{padding:32px 30px}.spark-logo-wrap{width:min(300px,100%);min-height:100px}.spark-logo{max-height:105px}.brand-panel h1{font-size:30px;margin:16px 0}.brand-panel p{font-size:13px}.overline{margin-top:20px}.login-panel{padding:35px 30px}}
</style>
</head>
<body>
<main class="login-shell">
  <section class="brand-panel">
    <div class="spark-logo-wrap"><img class="spark-logo" src="spark-logo.png" alt="Sustainability Spark by PTT Group"></div>
    <div class="overline">PTT PRE-REGISTRATION</div>
    <h1>ระบบจัดการ<br>ผู้ลงทะเบียน</h1>
    <p>บริหารจัดการข้อมูล ตรวจสอบสถานะ และส่งออกรายงานได้จากที่เดียว</p>
  </section>
  <section class="login-panel">
    <div class="welcome"><div class="shield">♢</div><div><h2>ยินดีต้อนรับ</h2><p>เข้าสู่ระบบเพื่อจัดการข้อมูล</p></div></div>
    <div id="configError" class="config-error hidden">Firebase Configuration ยังไม่พร้อม กรุณากำหนด API Key ใน firebase-config.js</div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Username</label><div class="input-wrap"><span>♙</span><input id="email" type="email" autocomplete="username" placeholder="กรอกอีเมลผู้ใช้" required></div></div>
      <div class="field"><label for="password">Password</label><div class="input-wrap"><span>♧</span><input id="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required><button id="togglePassword" class="toggle" type="button">แสดง</button></div></div>
      <button id="loginBtn" class="login-btn" type="submit"><span>เข้าสู่ระบบ</span><span>→</span></button>
    </form>
    <div id="message" class="message"></div>
    <div class="footer">PTT Public Company Limited</div>
  </section>
</main>
<script type="module">
import {firebaseConfig,isFirebaseConfigReady} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const $=id=>document.getElementById(id);const ready=isFirebaseConfigReady(firebaseConfig);let auth=null,submitting=false;
const savedEmail=localStorage.getItem('registerPocLoginEmail');if(savedEmail)$('email').value=savedEmail;
const params=new URLSearchParams(location.search);if(params.get('error')==='unauthorized')show('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งานระบบ','bad');
if(!ready){$('configError').classList.remove('hidden');$('loginBtn').disabled=true}else{const app=initializeApp(firebaseConfig);auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,user=>{if(user&&!submitting)location.replace('guests.html')})}
$('togglePassword').onclick=()=>{const input=$('password'),visible=input.type==='password';input.type=visible?'text':'password';$('togglePassword').textContent=visible?'ซ่อน':'แสดง'};
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!ready||submitting)return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return show('กรุณากรอก Username และ Password','bad');submitting=true;$('loginBtn').disabled=true;show('กำลังเข้าสู่ระบบ...');try{const credential=await signInWithEmailAndPassword(auth,email,password);localStorage.setItem('registerPocLoginEmail',credential.user.email||email);show('เข้าสู่ระบบสำเร็จ กำลังเปิดหน้ารายชื่อแขก','good');location.replace('guests.html')}catch(error){show(friendly(error),'bad');$('password').value='';$('password').focus()}finally{submitting=false;$('loginBtn').disabled=false}};
function show(text,type=''){$('message').textContent=text;$('message').className='message show '+type}function friendly(e){const code=e.code||'';if(code.includes('invalid-credential'))return'Username หรือ Password ไม่ถูกต้อง';if(code.includes('too-many-requests'))return'มีการลองเข้าสู่ระบบหลายครั้ง กรุณารอสักครู่';if(code.includes('network-request-failed'))return'ไม่สามารถเชื่อมต่อเครือข่ายได้';if(code.includes('user-disabled'))return'บัญชีนี้ถูกปิดใช้งาน';return code+': '+e.message}
</script>
</body>
</html>
